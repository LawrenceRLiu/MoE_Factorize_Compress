# Recovery Training Configuration for 2x A100 GPUs
# Optimized for fitting Qwen-3-30B-A3B on 2x 80GB A100s (cuda:0, cuda:1)
#
# RECOMMENDED USAGE with Accelerate:
#   accelerate launch --config_file accelerate_config_2xa100.yaml \
#       scripts/run_recovery_training.py \
#       --config-name config \
#       recovery=two_gpu \
#       experiment_name=my_experiment
#
# Alternative with torchrun:
#   torchrun --nproc_per_node=2 scripts/run_recovery_training.py \
#       --config-name config \
#       recovery=two_gpu \
#       experiment_name=my_experiment

# @package _global_

# Dataset configuration
dataset:
  name: "HuggingFaceFW/fineweb-edu"
  split: "train"
  streaming: true
  text_column: "text"
  max_length: 2048
  num_samples: null  # Full dataset

# Training hyperparameters
training:
  # Batch size and accumulation
  per_device_train_batch_size: 4  # Keep at 1 for memory safety
  gradient_accumulation_steps: 64  # For debugging rn # Adjusted to maintain similar token budget with seq_len=2048
  # Effective batch: 1 * 32 * 2 GPUs = 64 sequences, or 64*2048 = 131k tokens/batch

  # Learning rate and schedule
  learning_rate: 1e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100

  # Training duration (specify in tokens for easier budgeting)
  max_tokens: 10_000_000_000  # 10B tokens (will be converted to max_steps automatically)
  num_train_epochs: 1  # Ignored when using streaming datasets
  max_steps: null  # Will be calculated from max_tokens (or set explicitly to override)

  # Optimization
  # Use torchao 8-bit AdamW for ~75% optimizer memory reduction
  # This uses PyTorch's official torchao library (not bitsandbytes)
  # torchao optimizers are FSDP-compatible
  # Requires: pip install torchao
  optim: "adamw_torch_8bit"
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Precision - use bf16 for A100s
  bf16: true
  fp16: false

  # Checkpointing
  save_steps: 500
  save_total_limit: null  # Save all checkpoints (async eval will manage cleanup)

  # Logging
  logging_steps: 1
  logging_first_step: true

  # Evaluation
  evaluation_strategy: "no"
  eval_steps: 1000

  # Memory optimization
  gradient_checkpointing: true  # IMPORTANT: Enable to save memory
  dataloader_num_workers: 4
  remove_unused_columns: false

# FSDP Configuration for 2 GPUs
fsdp:
  enabled: true
  # Full sharding across 2 GPUs - most memory efficient
  fsdp_sharding_strategy: "full_shard"  # ZeRO-3: shard params, gradients, optimizer states
  fsdp_offload_params: false  # No CPU offload needed for 2x80GB A100s
  fsdp_state_dict_type: "full_state_dict"
  fsdp_transformer_layer_cls_to_wrap: null  # Use model-provided _no_split_modules for auto-wrap
  fsdp_backward_prefetch: "backward_pre"
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true  # Required for gradient checkpointing

# Model loading
model:
  compressed_checkpoint: null  # Will default to checkpoint-0
  dtype: "bfloat16"
  device_map: null  # IMPORTANT: null for FSDP (FSDP handles device placement)
  trust_remote_code: true

# WandB logging
wandb:
  enabled: true
  run_name: null
  tags: ["recovery", "pretraining", "2-gpu"]
  notes: "Recovery training on 2x A100 GPUs with FSDP"

# Learning Rate Schedule - Staged Training
# Stage 1: Train only wrappers and cores (freeze attention, embeddings, etc.)
# Stage 2: Fine-tune everything with smaller LR
lr_schedule:
  #warm up the cores so wrappers first adapt
  - fraction: 0.4  # First 40% of training
    base_lr_multiplier: 0.0  # Freeze everything by default
    param_patterns:
      # Shared cores in MoE layers
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.core$"
        lr_multiplier: 0.1
      # Low-rank wrappers (U and V matrices)
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.experts\\.\\d+\\.(input_wrapper|output_wrapper)\\.(U|V)$"
        lr_multiplier: 1.0
  #then jack up the lr for the cores to full lr
  - fraction: 0.4  # second 40% of training
    base_lr_multiplier: 0.0  # Freeze everything by default
    param_patterns:
      # Shared cores in MoE layers
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.core$"
        lr_multiplier: 1.0
      # Low-rank wrappers (U and V matrices)
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.experts\\.\\d+\\.(input_wrapper|output_wrapper)\\.(U|V)$"
        lr_multiplier: 1.0
  # finish off with finetuning everything at small lr
  - fraction: 0.2  # Second 50% of training
    base_lr_multiplier: 0.01  # 1% of base LR for attention, embeddings, etc.
    param_patterns:
      # Keep full LR for cores
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.core$"
        lr_multiplier: 1.0
      # Keep full LR for wrappers
      - pattern: ".*\\.experts\\.(gate_shared_core|up_shared_core|down_shared_core)\\.experts\\.\\d+\\.(input_wrapper|output_wrapper)\\.(U|V)$"
        lr_multiplier: 1.0
